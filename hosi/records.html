</div>








<div class="main">


<div class="topbar">


<h1>Medical Records</h1>



<div class="top-right">


<input type="text"
id="recordSearch"
placeholder="Search Patient...">


<i class="fa fa-bell"></i>


<i class="fa fa-user-circle"></i>


</div>


</div>









<div class="appointments">


<h2>

<i class="fa fa-file-medical"></i>

Create Patient Record

</h2>




<form id="recordForm">


<input type="text"
id="recordPatient"
placeholder="Patient Name"
required>




<input type="text"
id="doctor"
placeholder="Doctor Name"
required>




<input type="text"
id="symptoms"
placeholder="Symptoms"
required>




<input type="text"
id="diagnosis"
placeholder="Diagnosis"
required>




<textarea
id="treatment"
placeholder="Treatment Given">
</textarea>





<textarea
id="notes"
placeholder="Doctor Notes">
</textarea>





<input type="text"
id="prescription"
placeholder="Prescription">





<button type="submit">

Save Medical Record

</button>



</form>


</div>









<div class="appointments">


<h2>Patient Medical History</h2>



<table id="recordTable">


<thead>


<tr>


<th>ID</th>

<th>Patient</th>

<th>Doctor</th>

<th>Diagnosis</th>

<th>Treatment</th>

<th>Date</th>

<th>Action</th>


</tr>


</thead>



<tbody>


</tbody>



</table>



</div>



</div>








<script src="records.js"></script>
