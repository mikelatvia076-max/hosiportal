<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agnes Memorial Medical Hospital</title>

<link rel="stylesheet" href="login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="login-container">


<div class="login-box">


<div class="hospital-logo">

<i class="fa-solid fa-hospital"></i>

<h2>Agnes Memorial</h2>

<p id="formTitle">Medical Hospital Login</p>

</div>





<!-- LOGIN FORM -->

<form id="loginForm">


<div class="input-box">

<i class="fa fa-user"></i>

<input type="username"
id="username"
placeholder="username"
required>

</div>




<div class="input-box">

<i class="fa fa-lock"></i>

<input type="password"
id="password"
placeholder="Password"
required>

</div>




<select id="role">


<option>Select Role</option>

<option>Admin</option>

<option>Doctor</option>

<option>Nurse</option>

<option>Receptionist</option>

<option>Pharmacist</option>

<option>Laboratory</option>


</select>




<button type="submit">

Login

</button>


<p id="loginMessage"></p>



<p>

Don't have an account?

<button type="button" id="showRegister">

Register

</button>


</p>



</form>








<!-- REGISTER FORM -->


<form id="registerForm" style="display:none;">



<div class="input-box">

<input type="text"
id="fullname"
placeholder="Full Name"
required>

</div>





<div class="input-box">

<input type="text"
id="registerUsername"
placeholder="Username"
required>

</div>





<div class="input-box">

<input type="email"
id="email"
placeholder="Email"
required>

</div>





<div class="input-box">

<input type="password"
id="registerPassword"
placeholder="Password"
required>

</div>




<select id="registerRole">


<option>Select Role</option>

<option>Admin</option>

<option>Doctor</option>

<option>Nurse</option>

<option>Receptionist</option>

<option>Pharmacist</option>

<option>Laboratory</option>


</select>




<button type="submit">

Create Account

</button>



<p id="registerMessage"></p>



<p>

Already have an account?

<button type="button" id="showLogin">

Login

</button>


</p>


</form>




</div>


</div>


<script src="config.js"></script>


<script src="login.js"></script>


</body>

</html>
