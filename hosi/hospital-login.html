<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agnes Memorial Medical Hospital - Staff Login</title>
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="login-container">
  <div class="login-box">

    <div class="hospital-logo">
      <i class="fa-solid fa-hospital"></i>
      <h2>Agnes Memorial</h2>
      <p>Staff Login</p>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="input-box">
        <i class="fa fa-user"></i>
        <input type="text" id="username" placeholder="Username" autocomplete="username" autocapitalize="none" required>
      </div>

      <div class="input-box">
        <i class="fa fa-lock"></i>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="toggle" id="togglePw" aria-label="Show password"><i class="fa fa-eye"></i></button>
      </div>

      <select id="role" required>
        <option value="" selected disabled>Select role</option>
        <option>Admin</option>
        <option>Doctor</option>
        <option>Nurse</option>
        <option>Receptionist</option>
        <option>Pharmacist</option>
        <option>Laboratory</option>
      </select>

      <button type="submit" class="login-btn" id="loginBtn">Login</button>
      <p id="loginMessage" role="alert"></p>
    </form>

    <p class="access-note">
      <i class="fa fa-shield-halved"></i>
      Accounts are issued by hospital administration. Forgot your password? Ask the administrator to reset it.
    </p>

  </div>
</div>

<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
