<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Departments</title>

<style>
body{font-family:Arial,sans-serif;padding:15px;max-width:600px;margin:auto}
h1{font-size:22px;color:#075985}
input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:8px;border:1px solid #ccc}
button{background:#075985;color:#fff;border:none}
li{padding:8px 0;word-break:break-word}
body{background:linear-gradient(160deg,#dbeafe,#f0f9ff 55%,#ccfbf1);background-attachment:fixed;min-height:100vh}
h1{background:linear-gradient(135deg,#075985,#0ea5e9);color:#fff;padding:18px;border-radius:15px;box-shadow:0 10px 25px rgba(2,132,199,.3);text-align:center}
h2{color:#075985;border-bottom:2px solid #bae6fd;padding-bottom:8px}
input:focus{outline:none;border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.2)}
button{background:linear-gradient(90deg,#075985,#0284c7);box-shadow:0 6px 14px rgba(2,132,199,.3);cursor:pointer}
ul{list-style:none;padding:0}
li{background:#fff;border-left:5px solid #0284c7;border-radius:10px;padding:12px 15px;margin:10px 0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
</style>
</head>


<body>


<h1>Agnes Memorial Medical Hospital Departments</h1>


<input 
id="departmentName"
placeholder="Enter Department Name">


<button onclick="addDepartment()">
Add Department
</button>



<h2>Available Departments</h2>


<ul id="departmentList"></ul>

<script src="config.js"></script>

<script src="departments.js"></script>


</body>

</html>
