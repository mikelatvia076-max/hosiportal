<div class="main">


<div class="topbar">


<h1>Pharmacy Management</h1>



<div class="top-right">


<input type="text"
id="medicineSearch"
placeholder="Search Medicine...">



<i class="fa fa-bell"></i>


<i class="fa fa-user-circle"></i>


</div>


</div>









<div class="appointments">


<h2>

<i class="fa fa-pills"></i>

Add Medicine

</h2>





<form id="medicineForm">


<input type="text"
id="medicineName"
placeholder="Medicine Name"
required>




<select id="category">


<option>Select Category</option>

<option>Antibiotics</option>

<option>Pain Killers</option>

<option>Injection</option>

<option>Tablets</option>

<option>Syrup</option>


</select>





<input type="number"
id="quantity"
placeholder="Quantity"
required>





<input type="number"
id="price"
placeholder="Price (KES)"
required>





<input type="date"
id="expiry"
required>





<button type="submit">

Save Medicine

</button>



</form>



</div>









<div class="appointments">


<h2>Medicine Inventory</h2>




<table id="medicineTable">


<thead>


<tr>


<th>ID</th>

<th>Medicine</th>

<th>Category</th>

<th>Quantity</th>

<th>Price</th>

<th>Expiry</th>

<th>Action</th>


</tr>


</thead>



<tbody>



</tbody>


</table>
