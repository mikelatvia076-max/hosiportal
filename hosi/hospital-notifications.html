<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Notifications | Agnes Memorial Medical Hospital</title>
    <link rel="stylesheet" href="notification.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="notification-container">

        <button class="back-btn" onclick="goDashboard()">
            <i class="fa-solid fa-arrow-left"></i>
            Back To Dashboard
        </button>

        <h1>
            <i class="fa-solid fa-bell"></i>
            Hospital Notifications
            <span id="notificationCount" class="badge">0</span>
        </h1>

        <div id="hospitalNotificationList">
            <!-- Dynamic Notifications will render here -->
        </div>

    </div>
    <script src="config.js"></script>

    <script src="hospital-notifications.js"></script>

</body>
</html>
