<div class="main">


<div class="topbar">


<h1>Laboratory Management</h1>


<div class="top-right">


<input type="text"
id="labSearch"
placeholder="Search Test...">


<i class="fa fa-bell"></i>

<i class="fa fa-user-circle"></i>


</div>


</div>








<div class="appointments">


<h2>

<i class="fa fa-vial"></i>

New Laboratory Test

</h2>




<form id="labForm">



<input type="text"
id="labPatient"
placeholder="Patient Name"
required>




<input type="text"
id="labDoctor"
placeholder="Requested By Doctor"
required>




<select id="testName">


<option>Select Test</option>

<option>Blood Test</option>

<option>Urine Test</option>

<option>X-Ray</option>

<option>Ultrasound</option>

<option>CT Scan</option>

<option>COVID Test</option>


</select>




<select id="sampleStatus">


<option>Sample Status</option>

<option>Collected</option>

<option>Processing</option>

<option>Completed</option>


</select>





<textarea
id="results"
placeholder="Enter Results">
</textarea>




<button type="submit">

Save Laboratory Record

</button>



</form>


</div>









<div class="appointments">


<h2>Laboratory Records</h2>



<table id="labTable">


<thead>


<tr>


<th>ID</th>

<th>Patient</th>

<th>Doctor</th>

<th>Test</th>

<th>Status</th>

<th>Results</th>

<th>Action</th>


</tr>


</thead>



<tbody>


</tbody>


</table>
